name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete, so drop it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Fails outright if package-lock.json is out of sync with package.json.
      - name: Install dependencies
        id: install
        run: npm ci

      # The check steps below run even after an earlier one fails, so a single
      # run reports every problem instead of only the first. They are skipped
      # when the install itself failed, since none of them can say anything
      # useful without node_modules.
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      # eslint.config.js runs Prettier as a rule, so this covers formatting too.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx eslint .
